name: Build Minecraft Dungeons (nxnative) — build 2 (perfil fusionado + bring-up)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout (repo de build, sin archivos del juego)
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 27.2 y liberar disco
        run: |
          for d in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$d" ]; then sudo xcode-select -s "$d"; echo "Seleccionado $d"; fi
          done
          xcodebuild -version
          xcrun -sdk macosx metal --version
          for d in /Applications/Xcode*.app; do
            case "$(basename "$d")" in
              *27.2*) echo "mantengo $d" ;;
              *) echo "borro $d"; sudo rm -rf "$d" ;;
            esac
          done
          rm -rf ~/Library/Android 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app /Applications/Keynote.app /Applications/Numbers.app /Applications/Pages.app 2>/dev/null || true
          df -h /

      - name: Herramientas y nxnative (upstream, al día)
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk || true
          python3 -m pip install --user --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic
          python3 -m pip install --user --break-system-packages "backports.zstd; python_version < '3.14'" || true
          cd ~ && git clone --depth 1 https://github.com/seedds/nxnative.git

      - name: Parche - lanzador en español, ajustes y TÁCTIL (variante Dungeons)
        run: |
          python3 "$GITHUB_WORKSPACE/tools/traducir_y_ajustes_dungeons.py" ~/nxnative

      - name: Parche - piel de controles del propio juego (fase 2)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          # Los PNG son arte del juego: NO van en este repo público; bajan de la release privada
          mkdir -p ~/skin
          gh release download game --repo ShebasK0908/dungeons-build --pattern 'controles-dungeons-png.zip' --dir ~/skin
          cd ~/skin && unzip -o controles-dungeons-png.zip
          python3 "$GITHUB_WORKSPACE/tools/piel_dungeons.py" ~/nxnative --png-dir ~/skin/controles-dungeons-png

      - name: Descargar el juego desde la release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p ~/Games/Dungeons ~/keys
          cd ~/Games/Dungeons
          gh release download game --repo ShebasK0908/dungeons-build --dir dl
          ls -la dl
          cp dl/prod.keys ~/keys/prod.keys
          test -s ~/keys/prod.keys
          # UN SOLO juego en la carpeta (lección Naruto: «más de un juego en la carpeta»)
          cat dl/xci-part-* > game.xci
          ls -la
          test $(stat -f%z game.xci) -eq 7930147840
          python3 -c "d=open('game.xci','rb'); d.seek(0x100); assert d.read(4)==b'HEAD', 'magic HEAD no encontrado'; print('XCI HEAD ok')"

      - name: Sembrar el perfil FUSIONADO (build 2)
        run: |
          # Perfil revisado a mano (profile/game.tsv en este repo): la build lo reutiliza y SALTA el survey.
          # Claves nuevas frente a la build 1: pad_layout full, fps_target 60 / fps_max 120 (patrón ue_cvar
          # confirmado por los fixups de la build 1), depth_mode zero (detectado en su check boot) y los
          # build IDs reales de la v1769472. SIN op_mode: el modo lo elige el usuario en el lanzador.
          PDIR=~/Games/Dungeons/01006C100EC08000_build/profile/01006C100EC08000
          mkdir -p "$PDIR"
          cp "$GITHUB_WORKSPACE/profile/"* "$PDIR/"
          ls -la "$PDIR"
          grep -E '^(pad_layout|fps_target|fps_max|depth_mode|romfs_marker)' "$PDIR/game.tsv"

      - name: Bring-up — boot de comprobación largo en el host de Mac (240 s en nnMain)
        run: |
          # La build 1 solo dejó correr el juego 15 s en nnMain en su check de regiones: la intro es un
          # vídeo y el título (primera escena 3D real) llega después. Con 240 s el check boot de ESTA
          # build atraviesa la intro y carga el título en el host: si el error fatal se reproduce en Mac,
          # queda escrito en logs/region_check.log (se sube como artefacto al final). El check no tumba
          # la build si el host se para: informa y sigue.
          S=~/nxnative/scripts/build_ipa_from_nsp.py
          sed -i '' 's/^REGION_CHECK_NNMAIN_SECS = 15 /REGION_CHECK_NNMAIN_SECS = 240 /' "$S"
          grep -n '^REGION_CHECK_NNMAIN_SECS' "$S"
          grep -q '^REGION_CHECK_NNMAIN_SECS = 240' "$S"

      - name: Build del IPA (idioma del juego - español)
        run: |
          python3 ~/nxnative/scripts/build_ipa_from_nsp.py ~/Games/Dungeons -k ~/keys/prod.keys -l es --no-keep-extracted
          ls -la ~/Games/Dungeons

      - name: Subir el resultado a la release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cd ~/Games/Dungeons
          IPA=$(find . -maxdepth 2 -name '*.ipa' | head -1)
          test -n "$IPA"
          ls -la "$IPA"
          split -b 1900m "$IPA" ipa-part-
          PARTS=$(ls ipa-part-*)
          gh release create dungeons-ipa $PARTS --repo ShebasK0908/dungeons-build --title "Minecraft Dungeons IPA (privado)" --notes "Build 2 del usuario desde su copia (perfil fusionado + bring-up de 240 s). No compartir." || gh release upload dungeons-ipa $PARTS --clobber --repo ShebasK0908/dungeons-build

      - name: Subir logs y perfil final (diagnóstico del bring-up)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build2-logs-y-perfil
          path: |
            ~/Games/Dungeons/01006C100EC08000_build/logs
            ~/Games/Dungeons/01006C100EC08000_build/profile
          if-no-files-found: ignore
